<lib-mobile-page>
    <section class="register">
        <header class="title">
            <lib-title 
                title="Crie sua Conta" 
            />
        </header>

        <main class="form">
            <lib-button 
                typeButton="square"
                title="Cadastrar pelo Google" 
                color="google"
                icon="google.png"
            />

            <p class="or-spacing">
                OU
            </p>

            <div class="register">
                <div class="register-container">
                    <form 
                        [formGroup]="registerService.registerForm" 
                    >
                        <lib-register-form />
                        <lib-address-form />

                        <lib-button 
                            [typeButton]="'standard'"
                            [color]="'primary'"
                            type="submit"
                            title="Cadastrar" 
                            disabled="registerService.registerForm.invalid"
                        />
                    </form>
                </div>
            </div>

            
        </main>
    </section>
</lib-mobile-page>
