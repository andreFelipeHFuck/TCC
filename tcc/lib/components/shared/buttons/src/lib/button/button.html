@if (typeButton() === 'standard') {
    <button 
        mat-raised-button 
        class="standard"
        [ngClass]="color()"
        [disabled]="disabled()"
    >
        {{ title() }}
    </button>
} @else if (typeButton() === 'square') {
    <button 
        class="square square-type"
        [ngClass]="color()"
        [disabled]="disabled()"
    >
        @if (icon()) {
            <span class="button-icon material-symbols-outlined">
                {{ icon() }}
            </span>
        }
        {{ title() }}
    </button>
} @else if (typeButton() === 'thumb') {
    <lib-button-thumb 
        [title]="title()"
    />
}
