<lib-input
  [label]="'Nome'"
  [control]="nameControl()"
  [type]="'email'"
  [placeholder]="'Digite seu nome'"
/>

<lib-input
  [label]="'E-mail'"
  [control]="emailControl()"
  [type]="'email'"
  [placeholder]="'exemplo@email.com'"
/>

<lib-input
  [label]="'Senha'"
  [control]="passwordControl()"
  [type]="'password'"
  [placeholder]="''"
/>

<lib-input
  [label]="'Confirmar Senha'"
  [control]="confirmPasswordControl()"
  [type]="'password'"
  [placeholder]="''"
/>
