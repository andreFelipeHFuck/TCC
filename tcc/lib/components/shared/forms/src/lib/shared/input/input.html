
  @switch (type()) {
    @case ('text') {
      <mat-form-field 
          class="input-text"
          [appearance]="appearance()"
          hideRequiredMarker
      >
          <mat-label>
            {{ label() }}
          </mat-label>
          <input 
            matInput 
            [type]="type()" 
            [placeholder]="placeholder()" 
            [formControl]="control()!"
          >

          @if(control().invalid) {
            <mat-error>
              {{ errorMessage() }}
            </mat-error>
          }
      </mat-form-field>
    }
    @case ('email') {
      <mat-form-field 
          class="input-text"
          [appearance]="appearance()"
          hideRequiredMarker
      >
          <mat-label>
            {{ label() }}
          </mat-label>
          <input 
            matInput 
            [type]="type()" 
            [placeholder]="placeholder()" 
            [formControl]="control()!"
          >

          @if(control().invalid) {
            <mat-error>
              {{ errorMessage() }}
            </mat-error>
          }
      </mat-form-field>
    }
    @case ('password') {
      <mat-form-field 
        class="input-text"
        [appearance]="appearance()"
        hideRequiredMarker
      >
        <mat-label>
          {{ label() }}
        </mat-label>
        <!-- [type]="hidePassword ? 'password' : 'text'"  -->
        <input 
          matInput 
          [type]="type()" 
          [placeholder]="placeholder()" 
          [formControl]="control()!"
        >
        
        @if(control().invalid) {
          <mat-error>
            {{ errorMessage() }}
          </mat-error>
        }
    </mat-form-field>
    } 
  }
